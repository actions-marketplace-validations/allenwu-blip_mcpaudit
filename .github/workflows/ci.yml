name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # No API key and NO network are required: the scan core is pure and
      # the suite only reads local fixture directories. This is asserted by
      # the test suite itself (test/*.test.js).
      - run: npm test
      # Smoke-test the CLI exactly as a user would invoke it.
      - run: node bin/mcpaudit.js test/fixtures/clean-server --fail-on high
      - name: CLI must flag the vulnerable fixture (expect exit 1)
        run: |
          if node bin/mcpaudit.js test/fixtures/vulnerable-server --fail-on high; then
            echo "expected non-zero exit on the vulnerable fixture"; exit 1
          fi

  dogfood:
    # mcpaudit scans its own repo with its own Action (fails open by design).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: ./
        with:
          path: "src"
          fail-on: "high"
