name: "mcpaudit — MCP server security scan"
description: "Static pre-install security scan for MCP servers: flags command injection, secret exfiltration and over-broad scope."
author: "mcpaudit"
branding:
  icon: "shield"
  color: "red"

inputs:
  path:
    description: "Directory to scan (an MCP server's source tree). Defaults to the repo root."
    required: false
    default: "."
  fail-on:
    description: "Fail the step if any finding is at or above this severity: critical | high | medium | low | none."
    required: false
    default: "high"
  json:
    description: "If 'true', print machine-readable JSON instead of the human report."
    required: false
    default: "false"
  sarif:
    description: "If 'true', also write a SARIF v2.1.0 file (upload it with github/codeql-action/upload-sarif to populate the Code scanning tab)."
    required: false
    default: "false"
  sarif-file:
    description: "Path to write the SARIF file when sarif=true."
    required: false
    default: "mcpaudit.sarif"
  baseline:
    description: "Path to a committed baseline file. When set, only NEW findings (regressions vs the baseline) gate the step; triaged/accepted findings do not re-fail the build."
    required: false
    default: ""

outputs:
  total:
    description: "Total number of findings."
  critical:
    description: "Count of critical findings."
  high:
    description: "Count of high findings."
  medium:
    description: "Count of medium findings."
  low:
    description: "Count of low findings."
  gate:
    description: "'fail' if the gate tripped, else 'pass'."
  new:
    description: "With baseline: number of NEW findings vs the baseline."
  fixed:
    description: "With baseline: number of findings resolved since the baseline."
  sarif-file:
    description: "Path of the written SARIF file (when sarif=true)."

runs:
  using: "node20"
  main: "src/action.js"

# No tokens or secrets are required. This Action performs NO network I/O and
# never executes the scanned project. It only reads the source tree.
